version: '3.8'

services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avry-console
    ports:
      - "8086:8086"
    environment:
      - NODE_ENV=production
      - PORT=8086
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://avry-backend:8081}
      - VPS_BRIDGE_URL=${VPS_BRIDGE_URL:-http://avry-zeroclaw:8090}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aivory-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avry-console.rule=Host(`console.aivory.id`)"
      - "traefik.http.routers.avry-console.entrypoints=websecure"
      - "traefik.http.routers.avry-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.avry-console.loadbalancer.server.port=8086"

networks:
  aivory-network:
    name: aivory-network
    external: true
